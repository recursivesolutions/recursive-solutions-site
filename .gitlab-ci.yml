# GitLab CI/CD configuration for GitLab Pages
image: node:20-alpine

# Cache npm dependencies across pipeline runs
cache:
  key:
    files:
      - package.json
  paths:
    - .npm/

# GitLab Pages deployment job (job name MUST be 'pages')
pages:
  stage: deploy
  script:
    - npm ci --cache .npm --prefer-offline || npm install
    - npm test
    - npm run build
    - rm -rf public
    - mv dist public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "master"
